# fly.toml app configuration file generated for exchange-service on 2026-11-26T03:21:21Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'exchange-service'
primary_region = 'dfw'

[build]
  dockerfile = 'Dockerfile'

[env]
  CORS_ORIGINS = '*'
  DB_PATH = '/data/exchange-2026.sqlite'
  EMAIL_ENABLED = 'false'
  HOST = '0.0.0.0'
  NODE_ENV = 'production'
  PORT = '3000'

[[mounts]]
  source = 'exchange_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '1m0s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
